name: Reusable — Branch Name Check
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BR="${HEAD_REF}"
          # Allow automated agent and bot prefixes unconditionally
          if [[ "$BR" =~ ^(dependabot|builder|jules)/ ]]; then
            echo "✓ $BR (automated prefix — allowed)"
            exit 0
          fi
          if [[ ! "$BR" =~ ^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert|epic|epic-[0-9]+)/.+ ]]; then
            echo "::error::Branch '$BR' must match <type>/<slug> or an automated prefix (dependabot/builder/jules)"
            exit 1
          fi
          echo "✓ $BR"
