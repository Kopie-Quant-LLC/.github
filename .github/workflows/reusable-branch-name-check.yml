name: Reusable — Branch Name Check
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        run: |
          BR="${{ github.head_ref }}"
          if [[ ! "$BR" =~ ^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert)/.+ ]]; then
            echo "::error::Branch '$BR' must match <type>/<slug> (feat/fix/chore/docs/refactor/test/ci/perf/build/revert)"
            exit 1
          fi
          echo "✓ $BR"
