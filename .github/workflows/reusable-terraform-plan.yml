# Reusable Terraform Plan — the OIDC plan and the cost gate of kq-infra's pull-request gate (CEO, 2026-11-19; TASKS_ci_control_panel C4).
# Call it from a product repository's ci.yml, beside product-gate.yml, at a tag:
#   uses: Kopie-Quant-LLC/.github/.github/workflows/reusable-terraform-plan.yml@v2.0.0
# © Kopie Quant LLC
#
# Why this is not a lane of product-gate.yml: a called workflow can only lower its caller's token, and a job that asks for more stops the
# whole run, so product-gate.yml asks for `contents: read` alone. This plan mints an AWS token through the repository's OIDC trust, which needs
# `id-token: write`. The caller grants it on this one call, and the permission stays on this job: nothing else in the run can mint a token.
#
# The runner follows the PR's target, as in product-gate.yml (runner-policy.md): the expression below is copied from it. A reusable workflow
# reads the caller repository's variables.
#
# The plan runs on a pull request only. The live trust on the plan role sanctions exactly the `repo:...:pull_request` OIDC sub-claim, proven
# on a PR whose plan passed while a run on another event was refused at AssumeRoleWithWebIdentity. A person's dispatch has a different
# sub-claim, so it skips this job.
#
# The repository's own script is called by name from the caller's checkout: scripts/cost-gate/cost_gate.py reads `terraform show -json` of the plan.
#
# Version history: v1.x of this file was the generic format, validate, lint and plan workflow, which the old callers pin at v1.5.0 and which
# stays at those tags. From v2.0.0 it is kq-infra's plan job.

name: Reusable Terraform Plan

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "The exact Terraform version to install. Pin it: 1.7.5 and 1.8.0 fail to plan kq-infra's environments/prod/storage-job-store.tf."
        required: true
        type: string
      environment:
        description: "The folder under environments/ to plan."
        required: false
        type: string
        default: "prod"
      plan-role:
        description: "The name of the scoped IAM plan role the OIDC token assumes."
        required: true
        type: string
      aws-region:
        description: "The AWS region of the role and the plan."
        required: false
        type: string
        default: "us-east-1"
      cost-gate-max-delta:
        description: "The monthly cost delta, in dollars, above which scripts/cost-gate/cost_gate.py fails the job."
        required: false
        type: string
        default: "50"
    secrets:
      AWS_ACCOUNT_ID:
        description: "The account the plan role lives in. It composes the OIDC role ARN."
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(github.base_ref == 'main' && (vars.KQ_RUNNER_PR_MAIN || '["ubuntu-latest"]') || (vars.KQ_RUNNER_PR_INTEGRATION || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Granted ONLY on this job. Nothing else in the caller's run can mint an AWS token.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          # AWS_ACCOUNT_ID is a repository secret. A CALLED workflow inherits no secrets unless the caller passes them.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.plan-role }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false

      # -out is what makes the plan readable by anything other than a human:
      # the cost gate below consumes `terraform show -json` of this file.
      - name: Terraform Plan
        working-directory: environments/${{ inputs.environment }}
        run: terraform plan -var-file=terraform.tfvars -out=tfplan -no-color -input=false

      - name: Cost gate (blocks above the monthly delta threshold)
        working-directory: environments/${{ inputs.environment }}
        env:
          KQ_COST_GATE_MAX_DELTA: ${{ inputs.cost-gate-max-delta }}
        run: |
          terraform show -json tfplan \
            | python3 "${GITHUB_WORKSPACE}/scripts/cost-gate/cost_gate.py"
