name: Jules — Aggregate Code-Maps

on:
  schedule:
    # Daily at 18:00 UTC (13:00 CDT) — gives Jules time to complete sessions
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIVE_REPOS: >-
    kq-terminal
    kq-admin
    kq-website
    kq-knowledge
    kq-infra
    .github
    kq-knowledge-graph
    kq-forge-engine
    kq-victory-engine

jobs:
  aggregate:
    name: Aggregate code-maps
    runs-on: ubuntu-latest
    if: github.actor == 'YXZYSME' || github.event_name == 'schedule'
    steps:
      - name: Checkout kq-knowledge-graph
        uses: actions/checkout@v6
        with:
          repository: Kopie-Quant-LLC/kq-knowledge-graph
          token: ${{ secrets.KQ_SYNC_PAT }}
          path: knowledge-graph

      - name: Collect code-maps from all repos
        env:
          GH_TOKEN: ${{ secrets.KQ_SYNC_PAT }}
        run: |
          mkdir -p collected

          for REPO in $ACTIVE_REPOS; do
            TARGET_REPO="$REPO"
            [ "$REPO" = ".github" ] && TARGET_REPO=".github"

            echo "--- Fetching $REPO ---"
            CONTENT=$(gh api "repos/Kopie-Quant-LLC/$TARGET_REPO/contents/docs/code-map.json" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || true

            if [ -n "$CONTENT" ] && echo "$CONTENT" | jq . > /dev/null 2>&1; then
              echo "$CONTENT" | jq . > "collected/${REPO//\//-}.json"
              echo "✅ $REPO — collected"
            else
              echo "⏭️  $REPO — no code-map.json yet (skipping)"
            fi
          done

          echo ""
          echo "Collected $(ls collected/ | wc -l | tr -d ' ') code-maps"

      - name: Assemble unified map
        run: |
          cat > knowledge-graph/maps/unified-code-map.md << 'HEADER'
          # Kopie-Quant-LLC — Unified Code-Map

          > Auto-generated by the Jules Code-Map Aggregator workflow.
          > Do not edit manually — this file is overwritten on each run.
          > Source: `docs/code-map.json` from each active repo.

          HEADER

          echo "**Last aggregated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> knowledge-graph/maps/unified-code-map.md
          echo "" >> knowledge-graph/maps/unified-code-map.md
          echo "---" >> knowledge-graph/maps/unified-code-map.md
          echo "" >> knowledge-graph/maps/unified-code-map.md

          for MAP_FILE in collected/*.json; do
            [ -f "$MAP_FILE" ] || continue

            REPO=$(jq -r '.repo' "$MAP_FILE")
            GENERATED=$(jq -r '.generatedAt' "$MAP_FILE")

            echo "## $REPO" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "**Generated:** $GENERATED" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # Entry Points
            echo "### Entry Points" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "| Path | Type | Description |" >> knowledge-graph/maps/unified-code-map.md
            echo "|---|---|---|" >> knowledge-graph/maps/unified-code-map.md
            jq -r '.entryPoints[] | "| `\(.path)` | \(.type) | \(.description) |"' "$MAP_FILE" \
              >> knowledge-graph/maps/unified-code-map.md 2>/dev/null || echo "| — | — | No data |" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # Public Interfaces
            echo "### Public Interfaces" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "| Path | Type | Description |" >> knowledge-graph/maps/unified-code-map.md
            echo "|---|---|---|" >> knowledge-graph/maps/unified-code-map.md
            jq -r '.publicInterfaces[] | "| `\(.path)` | \(.type) | \(.description) |"' "$MAP_FILE" \
              >> knowledge-graph/maps/unified-code-map.md 2>/dev/null || echo "| — | — | No data |" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # Internal Dependencies
            echo "### Internal Dependencies" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            INTERNAL_COUNT=$(jq '.dependencies.internal | length' "$MAP_FILE" 2>/dev/null || echo "0")
            if [ "$INTERNAL_COUNT" -gt 0 ]; then
              echo "| Repo | Interface | Description |" >> knowledge-graph/maps/unified-code-map.md
              echo "|---|---|---|" >> knowledge-graph/maps/unified-code-map.md
              jq -r '.dependencies.internal[] | "| `\(.repo)` | \(.interface) | \(.description) |"' "$MAP_FILE" \
                >> knowledge-graph/maps/unified-code-map.md
            else
              echo "*No internal dependencies.*" >> knowledge-graph/maps/unified-code-map.md
            fi
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # External Dependencies (top 10)
            echo "### Key External Dependencies" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "| Package | Version | Purpose |" >> knowledge-graph/maps/unified-code-map.md
            echo "|---|---|---|" >> knowledge-graph/maps/unified-code-map.md
            jq -r '.dependencies.external[:10][] | "| `\(.name)` | \(.version // "—") | \(.purpose) |"' "$MAP_FILE" \
              >> knowledge-graph/maps/unified-code-map.md 2>/dev/null || echo "| — | — | No data |" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # Workflows
            echo "### Workflows" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "| File | Triggers | Purpose |" >> knowledge-graph/maps/unified-code-map.md
            echo "|---|---|---|" >> knowledge-graph/maps/unified-code-map.md
            jq -r '.workflows[] | "| `\(.file)` | \(.triggers | join(", ")) | \(.purpose) |"' "$MAP_FILE" \
              >> knowledge-graph/maps/unified-code-map.md 2>/dev/null || echo "| — | — | No data |" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md

            # Agent Footprint
            echo "### Agent Footprint" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            HAS_AGENTS=$(jq -r '.agentFootprint.hasAgentsMd // false' "$MAP_FILE")
            HAS_HEADER=$(jq -r '.agentFootprint.hasCanonicalHeader // false' "$MAP_FILE")
            HEADER_VER=$(jq -r '.agentFootprint.headerVersion // "—"' "$MAP_FILE")
            HAS_DOT_AGENT=$(jq -r '.agentFootprint.hasDotAgent // false' "$MAP_FILE")
            HAS_COPILOT=$(jq -r '.agentFootprint.hasCopilotInstructions // false' "$MAP_FILE")
            echo "- AGENTS.md: $HAS_AGENTS | Canonical Header: $HAS_HEADER ($HEADER_VER) | .agent/: $HAS_DOT_AGENT | Copilot Instructions: $HAS_COPILOT" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
            echo "---" >> knowledge-graph/maps/unified-code-map.md
            echo "" >> knowledge-graph/maps/unified-code-map.md
          done

          echo "Unified map assembled."

      - name: Check for changes
        id: diff
        working-directory: knowledge-graph
        run: |
          git add maps/unified-code-map.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — map is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will open PR."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: knowledge-graph
        env:
          GH_TOKEN: ${{ secrets.KQ_SYNC_PAT }}
        run: |
          BRANCH="chore/codemap-aggregate-$(date -u +%Y%m%d)"
          git config user.name "Sun YXZYS"
          git config user.email "sun@yxzys.me"

          # Delete existing remote branch if it exists (from a previous run today)
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git commit -m "chore(maps): aggregate unified code-map

          Signed-off-by: Sun YXZYS <sun@yxzys.me>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.KQ_SYNC_PAT }}
        run: |
          BRANCH="chore/codemap-aggregate-$(date -u +%Y%m%d)"
          gh pr create \
            -R Kopie-Quant-LLC/kq-knowledge-graph \
            --title "chore(maps): aggregate unified code-map $(date -u +%Y-%m-%d)" \
            --body "Auto-aggregated from \`docs/code-map.json\` across all active repos.

          Signed-off-by: Sun YXZYS <sun@yxzys.me>" \
            --head "$BRANCH" \
            --reviewer YXZYSME

      - name: Summary
        run: |
          COLLECTED=$(ls collected/ 2>/dev/null | wc -l | tr -d ' ')
          echo "### Code-Map Aggregation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repos collected:** $COLLECTED / 9" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Changes detected:** ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          for f in collected/*.json; do
            [ -f "$f" ] || continue
            REPO=$(jq -r '.repo' "$f")
            echo "  - ✅ $REPO" >> "$GITHUB_STEP_SUMMARY"
          done
