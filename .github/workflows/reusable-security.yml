name: Reusable — Security Scans
on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true   # 'python' | 'rust' | 'node' | 'none'
      working-directory:
        type: string
        default: "."
      docker-context:
        type: string
        default: ""
      dockerfile:
        type: string
        default: "Dockerfile"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks OSS
        run: |
          VER=8.21.2
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks && chmod +x gitleaks
      - name: Run gitleaks
        run: |
          ./gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --exit-code 1 --no-banner
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        with: { sarif_file: gitleaks.sarif }

  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: inputs.language == 'python'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output pip-audit.json --format json || true
        continue-on-error: true
      - name: Upload pip-audit results
        if: inputs.language == 'python' && always()
        run: |
          if [ -f pip-audit.json ]; then
            echo "pip-audit results:"
            cat pip-audit.json | python -m json.tool | head -50
          else
            echo "No pip-audit output file found."
          fi
      - if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.language == 'rust'
        run: cargo install --locked cargo-audit && cargo audit
      - if: inputs.language == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - if: inputs.language == 'node'
        run: npm audit --audit-level=high || true

  container:
    if: inputs.docker-context != ''
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ inputs.dockerfile }} -t scan-target:latest ${{ inputs.docker-context }}
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
