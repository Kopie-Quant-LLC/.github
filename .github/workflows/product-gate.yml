# product-gate — the one pull-request gate of every product repository (CEO, 2026-11-19; TASKS_ci_control_panel C2).
# Call it from a product repository's ci.yml, at a tag:
#   uses: Kopie-Quant-LLC/.github/.github/workflows/product-gate.yml@v2.3.0
# © Kopie Quant LLC
#
# The runner follows the PR's target, and nothing else (runner-policy.md):
#   a PR into main            the whole gate (every lane, and security) on GitHub-hosted ubuntu-latest
#   a PR into integration     the intake gate (the format check, and security) on the mini
#   a person's dispatch       the whole gate on the mini, and the two guards
# The two runner values are the organization variables KQ_RUNNER_PR_MAIN and KQ_RUNNER_PR_INTEGRATION when they are set, and the defaults below
# when they are not: a reusable workflow reads the caller repository's variables, and an unset variable reads as an empty string.
#
# What stays in the product repository, called by name: each lane is the script scripts/ci/gate/<lane>.sh, run whole from the repository root
# with BASE_SHA set (the PR's base sha, or empty on a dispatch, which means the whole repository). The gate supplies the checkout, the
# toolchains, the caches and the sibling access; the script holds the repository's own commands, as its lane workflow did.
#
# Siblings: a lane script places the sibling repositories it reads with scripts/ci/place_siblings.sh, which clones over SSH. On the mini that is
# the runner's own key. On a hosted runner the gate routes those SSH URLs to HTTPS with the read token SIBLING_READ_TOKEN, so the same script
# runs unchanged on both runners.
#
# A failure stops the whole run of a pull request (CEO, 2026-11-24: no runner keeps paying for a gate that is already red). Two parts:
#   the lane matrix is fail-fast on a pull_request, so the first red lane cancels its sibling lanes, with no permission needed;
#   each job's last step cancels the whole run when the job failed (`Stop the run on a failure`), which reaches the security and intake jobs too.
# That step needs `actions: write`, so each job asks for it beside `contents: read`. A called workflow can only lower its caller's token, and a
# job that asks for more than the caller grants stops the whole run before it starts: a caller of v2.4.0 or later grants the gate job
#   permissions: { contents: read, actions: write }
# The seed run (pull_request_target) and a dispatch never stop early: the seed must save main's cache (CEO 2026-11-20).
# kq-infra's OIDC plan, which needs id-token: write, is reusable-terraform-plan.yml, called beside this gate.

name: product-gate

on:
  workflow_call:
    inputs:
      lanes:
        description: 'JSON array of lane names. Each runs scripts/ci/gate/<lane>.sh on a PR into main and on a dispatch. Example: ["lint","test-unit"]'
        required: false
        type: string
        default: "[]"
      intake:
        description: "The intake command a PR into integration runs: a check that builds nothing."
        required: false
        type: string
        default: "cargo fmt --all -- --check"
      intake-dir:
        description: "The folder the intake command runs in."
        required: false
        type: string
        default: "."
      rust-toolchain:
        description: 'The exact Rust toolchain to install with rustfmt and clippy. Empty: none is installed, and rust-toolchain.toml or the runner default holds.'
        required: false
        type: string
        default: ""
      rust-workspaces:
        description: "Newline list of the Rust workspace folders the cache keys on, as Swatinem/rust-cache's workspaces input. Empty: no Rust cache."
        required: false
        type: string
        default: "."
      node-version:
        description: "A Node version to install for the lanes. Empty: none."
        required: false
        type: string
        default: ""
      python-version:
        description: "A Python version to install on a hosted runner. The mini uses its own interpreters. Empty: none."
        required: false
        type: string
        default: ""
      terraform-version:
        description: "A Terraform version to install. Empty: none."
        required: false
        type: string
        default: ""
      seed-timeout-minutes:
        description: "The lane limit of the seed run, the gate's run on main after a merge (pull_request_target). It builds the whole repository cold, so it has no PR budget."
        required: false
        type: number
        default: 60
      lane-timeout-minutes:
        description: "Each lane's limit."
        required: false
        type: number
        default: 15
      security-timeout-minutes:
        description: "The secret scan and workflow audit's limit."
        required: false
        type: number
        default: 15
      gitleaks-version:
        description: "The gitleaks release the secret scan installs, checked against its published checksums."
        required: false
        type: string
        default: "8.30.1"
      gitleaks-args:
        description: "The gitleaks arguments of the secret scan."
        required: false
        type: string
        default: "git --redact -v ."
      zizmor-version:
        description: "The zizmor release that audits the workflows. Empty: no audit."
        required: false
        type: string
        default: "1.29.0"
    secrets:
      SIBLING_READ_TOKEN:
        description: "Read-only Contents on the sibling repositories a lane places. Needed on a hosted runner only."
        required: false
      CONTRACTS_READ_TOKEN:
        description: "Read-only Contents on the repository a contracts lane compares against."
        required: false

permissions:
  contents: read

env:
  # Rust Framework C7: a gate's target does not persist, so it writes no incremental state.
  CARGO_INCREMENTAL: "0"

jobs:
  intake:
    name: Format (intake)
    permissions:
      contents: read
      actions: write
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ${{ fromJSON(github.base_ref == 'main' && (vars.KQ_RUNNER_PR_MAIN || '["ubuntu-latest"]') || (vars.KQ_RUNNER_PR_INTEGRATION || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        if: inputs.rust-toolchain != ''
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt
      - name: Install Terraform
        if: inputs.terraform-version != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: The intake check
        working-directory: ${{ inputs.intake-dir }}
        env:
          INTAKE: ${{ inputs.intake }}
        run: bash -c "$INTAKE"

      # The run stops on this job's failure (CEO, 2026-11-24): the lanes still running are cancelled, so no runner pays for a gate that is
      # already red. A pull request only; the caller grants actions: write (the header).
      - name: Stop the run on a failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}/repos/${REPO}/actions/runs/${RUN}/cancel")"
          echo "cancel run ${RUN}: HTTP ${code}"
          case "$code" in
            202|409) ;;
            *) echo "::warning::the run was not stopped (HTTP ${code}): the caller's gate job grants actions: write from v2.4.0" ;;
          esac

  security:
    name: security
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.base_ref == 'main' && (vars.KQ_RUNNER_PR_MAIN || '["ubuntu-latest"]') || (vars.KQ_RUNNER_PR_INTEGRATION || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: ${{ inputs.security-timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its published checksums
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset="gitleaks_${VERSION}_darwin_arm64.tar.gz" ;;
            Linux-x86_64) asset="gitleaks_${VERSION}_linux_x64.tar.gz" ;;
            Linux-aarch64) asset="gitleaks_${VERSION}_linux_arm64.tar.gz" ;;
            *) echo "::error::no gitleaks asset for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -o "$dir/$asset" "$base/$asset"
          curl -fsSL -o "$dir/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
          want="$(awk -v a="$asset" '$2 == a {print $1}' "$dir/checksums.txt")"
          have="$(shasum -a 256 "$dir/$asset" | awk '{print $1}')"
          if [ -z "$want" ] || [ "$want" != "$have" ]; then
            echo "::error::gitleaks $asset checksum mismatch: published '${want}', downloaded '${have}'"
            exit 1
          fi
          tar -xzf "$dir/$asset" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Secret scan
        env:
          ARGS: ${{ inputs.gitleaks-args }}
        run: |
          set -euo pipefail
          read -r -a args <<<"$ARGS"
          gitleaks "${args[@]}"
      - name: Workflow audit
        if: ${{ !cancelled() && inputs.zizmor-version != '' }}
        env:
          VERSION: ${{ inputs.zizmor-version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet "zizmor==${VERSION}"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline .github/workflows/

      # The run stops on this job's failure (CEO, 2026-11-24): the lanes still running are cancelled, so no runner pays for a gate that is
      # already red. A pull request only; the caller grants actions: write (the header).
      - name: Stop the run on a failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}/repos/${REPO}/actions/runs/${RUN}/cancel")"
          echo "cancel run ${RUN}: HTTP ${code}"
          case "$code" in
            202|409) ;;
            *) echo "::warning::the run was not stopped (HTTP ${code}): the caller's gate job grants actions: write from v2.4.0" ;;
          esac

  lane:
    name: ${{ matrix.lane }}
    permissions:
      contents: read
      actions: write
    if: inputs.lanes != '[]' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ${{ fromJSON(github.base_ref == 'main' && (vars.KQ_RUNNER_PR_MAIN || '["ubuntu-latest"]') || (vars.KQ_RUNNER_PR_INTEGRATION || '["self-hosted","macOS","ARM64"]')) }}
    # The seed run (pull_request_target, after a merge into main) builds the whole repository from a cold cache, so it takes the seed's limit.
    timeout-minutes: ${{ github.event_name == 'pull_request_target' && inputs.seed-timeout-minutes || inputs.lane-timeout-minutes }}
    # GitHub gives pull_request_target a read-only cache since 2026-06-26, and a save there only logs a skip. Without this line the seed run
    # never saved main's Linux cache, so every PR into main compiled from nothing on a 2-core runner (kq-core-backend#248, 2026-11-20).
    cache-mode: write
    strategy:
      # A pull request stops its other lanes on the first red one (CEO, 2026-11-24). The seed and a dispatch run every lane to its end.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        lane: ${{ fromJSON(inputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The mini reads its own local caches and never GitHub's (CEO 2026-11-20): the farm's sccache store, which the runner's .env names
      # (kq-farm install/runner-env), and the runner's own ~/.cargo, whose registry is already warm. No rust-cache step runs there, so nothing
      # trims that cargo home, which is why the job-local cargo home of 2026-11-06 left. Its old GitHub caches were macOS entries that no hosted
      # job could read, and they filled the 10 GB each repository has (kq-core-backend held 10.4 GB on 2026-11-20).
      # A hosted runner: sccache with GitHub's cache as its store. Each compiled unit is stored as it finishes, so a run cancelled at its
      # limit still leaves its work to the next, and cc-rs routes C and C++ through the same RUSTC_WRAPPER (cc 1.2,
      # rustc_wrapper_fallback). Without it, kq-l1-data-engineering#226's lint compiled the bundled DuckDB from source for 25 minutes and
      # was cancelled at 30, and kq-console#128's rust lane was cancelled while building kq-core-backend's gatekeeper (2026-11-20).
      - name: The runner's compile cache and cargo home
        run: | # zizmor: ignore[github-env] fixed values and a path under the runner's own temp folder, with no value from the event
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          fi

      - name: Install sccache (hosted runner)
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.19.0"

      # A hosted runner reads the siblings over HTTPS with the read token: place_siblings.sh's SSH URLs are rewritten to it.
      # The token goes into git's own credential store, which the lane step reads with no variable of its own. v2.0.0 ran
      # `gh auth setup-git`, whose helper asks gh for the token at clone time: the lane step holds no GH_TOKEN, so every
      # sibling clone failed "could not read Username for 'https://github.com'" (2026-11-20, the first PRs into main).
      - name: Sibling access on a hosted runner
        if: runner.environment == 'github-hosted'
        env:
          SIBLING_READ_TOKEN: ${{ secrets.SIBLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLING_READ_TOKEN" ]; then
            echo "no SIBLING_READ_TOKEN: a lane that places a sibling fails by name in place_siblings.sh"
            exit 0
          fi
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$SIBLING_READ_TOKEN" > "$HOME/.git-credentials"
          git config --global credential."https://github.com".helper store
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Rust toolchain
        if: inputs.rust-toolchain != ''
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt, clippy

      # A hosted runner only: the mini compiles from its local stores and restores nothing from GitHub. A hosted run saves its own cache,
      # which that PR's next run restores, and the seed run on main saves the one every new PR into main restores, keyed by Cargo.lock and by its LANE: one shared key let the lint lane save clippy's metadata first,
      # and the test lanes then restored that key, compiled every crate again and could never save over a full match (kq-core-backend#246,
      # 2026-11-20: test-unit and boundary cancelled at 14 minutes, still compiling dependencies). A hosted lane also saves when it fails
      # or is cancelled at its limit, so a cold first run leaves its compiled dependencies to the next run instead of nothing.
      - name: Restore the Rust cache
        if: inputs.rust-workspaces != '' && runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.rust-workspaces }}
          cache-bin: false
          shared-key: gate-${{ matrix.lane }}
          cache-on-failure: true

      - name: Install Node
        if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Python (hosted runner)
        if: inputs.python-version != '' && runner.environment == 'github-hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Terraform
        if: inputs.terraform-version != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: The lane's own script
        env:
          LANE: ${{ matrix.lane }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT: ${{ github.event_name }}
          CONTRACTS_READ_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          # A PR lints and tests what its diff changed. The seed run compares against the repository's first commit, so every crate reads as
          # changed and main's cache holds the whole workspace: an empty base reads as origin/main in several lane scripts, which on main after
          # the merge selects nothing, and the PR's own base selects nothing when the merged PR changed only workflow files.
          if [ "$EVENT" = "pull_request_target" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          else
            BASE_SHA="$PR_BASE_SHA"
          fi
          export BASE_SHA
          script="scripts/ci/gate/${LANE}.sh"
          if [ ! -f "$script" ]; then
            echo "::error::lane '${LANE}' has no script ${script} in this repository"
            exit 1
          fi
          bash "$script"

  # The guards run once, from here, on a person's dispatch (they left the PR tier on 2026-11-01). They are named by full path at this
  # file's own tag: a `./` path inside a called workflow reads the caller's workspace, and a new tag moves these two refs in the same commit
  # (runner-policy.md, How a change rolls out).

      # The run stops on this job's failure (CEO, 2026-11-24): the lanes still running are cancelled, so no runner pays for a gate that is
      # already red. A pull request only; the caller grants actions: write (the header).
      - name: Stop the run on a failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}/repos/${REPO}/actions/runs/${RUN}/cancel")"
          echo "cancel run ${RUN}: HTTP ${code}"
          case "$code" in
            202|409) ;;
            *) echo "::warning::the run was not stopped (HTTP ${code}): the caller's gate job grants actions: write from v2.4.0" ;;
          esac
  runner-routing-guard:
    if: github.event_name == 'workflow_dispatch'
    uses: Kopie-Quant-LLC/.github/.github/workflows/reusable-runner-routing-guard.yml@v2.3.0

  gitignore-guard:
    if: github.event_name == 'workflow_dispatch'
    uses: Kopie-Quant-LLC/.github/.github/workflows/reusable-gitignore-guard.yml@v2.3.0
