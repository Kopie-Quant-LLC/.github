name: Jules — Dependency Sweep

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo (e.g., kq-website)'
        required: true
        type: choice
        options:
          - kq-website
          - kq-admin
          - kq-terminal
          - kq-victory-engine
          - kq-forge-engine
      charter_id:
        description: 'Charter item ID (e.g., TS6, ESLint10, Python314)'
        required: true
        type: choice
        options:
          - TS6
          - ESLint10
          - Python314
          - lucide1
          - debian13
          - wasmtime
          - rust195
          - pyo3-028
          - polars-053
      ticket_id:
        description: 'Migration ticket ID (e.g., DEPSWEEP-0001)'
        required: true
        type: string
      prompt:
        description: 'Migration task prompt for Jules (from the ticket user_prompt)'
        required: true
        type: string
      system_prompt:
        description: 'System prompt override (from the ticket system_prompt)'
        required: false
        type: string
      branch:
        description: 'Starting branch (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  pre-flight:
    name: Pre-flight charter & governance checks
    runs-on: ubuntu-latest
    if: github.actor == 'YXZYSME'
    outputs:
      source_name: ${{ steps.source.outputs.source_name }}
      branch_name: ${{ steps.naming.outputs.branch_name }}
    steps:
      - name: Validate actor gate
        run: |
          echo "✅ Actor gate passed: ${{ github.actor }}"

      - name: Charter gate
        run: |
          CHARTER="${{ inputs.charter_id }}"
          REPO="${{ inputs.target_repo }}"

          # Engine-internals guard
          case "$CHARTER" in
            wasmtime|rust195|pyo3-028)
              case "$REPO" in
                kq-victory-engine|kq-forge-engine)
                  echo "⚠️  Engine-internals charter item ($CHARTER) on $REPO"
                  echo "   Vision Directive required — ensure VD-XXXX is referenced in the ticket."
                  ;;
              esac
              ;;
          esac

          echo "✅ Charter gate passed: $CHARTER → $REPO"

      - name: Compute branch name
        id: naming
        run: |
          TICKET="${{ inputs.ticket_id }}"
          REPO="${{ inputs.target_repo }}"
          CHARTER="${{ inputs.charter_id }}"
          # Lowercase the charter ID for branch naming
          CHARTER_LOWER=$(echo "$CHARTER" | tr '[:upper:]' '[:lower:]')
          BRANCH="jules/depsweep/${REPO}/${CHARTER_LOWER}-${TICKET}"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH"

      - name: Resolve source ID
        id: source
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
        run: |
          SOURCES=$(curl -sf \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sources")

          # Exact match: source name must end with the full org/repo path
          SOURCE_NAME=$(echo "$SOURCES" | jq -r \
            '.sources[] | select(.name | endswith("Kopie-Quant-LLC/${{ inputs.target_repo }}")) | .name')

          # Fallback: try matching by id field
          if [ -z "$SOURCE_NAME" ] || [ "$SOURCE_NAME" = "null" ]; then
            SOURCE_NAME=$(echo "$SOURCES" | jq -r \
              '.sources[] | select(.id | endswith("Kopie-Quant-LLC/${{ inputs.target_repo }}")) | .name')
          fi

          if [ -z "$SOURCE_NAME" ] || [ "$SOURCE_NAME" = "null" ]; then
            echo "::error::Source not found for ${{ inputs.target_repo }}. Available sources:"
            echo "$SOURCES" | jq '.sources[].name' 2>/dev/null || echo "$SOURCES"
            exit 1
          fi

          echo "source_name=$SOURCE_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved: $SOURCE_NAME"

  dispatch:
    name: Create Jules sweep session
    needs: pre-flight
    runs-on: ubuntu-latest
    steps:
      - name: Build system prompt
        id: sysprompt
        run: |
          # Use the provided system_prompt input, or fall back to the canonical template
          if [ -n "${{ inputs.system_prompt }}" ]; then
            SYSTEM_PROMPT="${{ inputs.system_prompt }}"
          else
            read -r -d '' SYSTEM_PROMPT << 'SYSPROMPT_EOF' || true
          You are running as `kq-jules-depsweep` slot:migration-scribe. You are a
          mechanical migration scribe. You DO NOT design. You DO NOT refactor. You
          DO NOT add dependencies. You execute the mechanical_operations list in
          order and stop.

          If you cannot complete an operation without making a design decision,
          write a comment in the PR body under "BLOCKED — needs human decision"
          and end the session WITHOUT touching the code.

          Wave 3 invariants are absolute:
          - Exactly one Signed-off-by trailer per commit (do not add it; the
            human consumer will re-author the squash).
          - Zero Co-Authored-By or Generated-By trailers anywhere.
          - No 🤖 emoji or AI self-attribution in commits or PR body.
          SYSPROMPT_EOF
          fi
          echo "system_prompt<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SYSTEM_PROMPT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Jules session
        id: session
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
          USER_PROMPT: ${{ inputs.prompt }}
          SYSTEM_PROMPT: ${{ steps.sysprompt.outputs.system_prompt }}
        run: |
          REPO="${{ inputs.target_repo }}"
          CHARTER="${{ inputs.charter_id }}"
          TICKET="${{ inputs.ticket_id }}"
          BRANCH="${{ needs.pre-flight.outputs.branch_name }}"

          # Combine system prompt + user prompt into a single prompt payload
          # (Jules API uses a single prompt field)
          FULL_PROMPT="$SYSTEM_PROMPT

          ---

          TASK:
          $USER_PROMPT

          ---

          DISCLOSURE BLOCK (place in PR body verbatim):

          <!-- jules-helper-disclosure -->
          - Slot type: migration-scribe
          - Jules session: <THIS_SESSION_ID>
          - Originating Dependabot PR: see migration ticket
          - Migration ticket: $TICKET
          - Scope: $CHARTER sweep on $REPO
          - Mechanical only: yes
          - Will be squash-merged by: kq-sre"

          PROMPT_JSON=$(echo "$FULL_PROMPT" | jq -Rs .)

          RESPONSE=$(curl -sf -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": $PROMPT_JSON,
              \"sourceContext\": {
                \"source\": \"${{ needs.pre-flight.outputs.source_name }}\",
                \"githubRepoContext\": {
                  \"startingBranch\": \"${{ inputs.branch }}\"
                }
              },
              \"requirePlanApproval\": false,
              \"automationMode\": \"AUTO_CREATE_PR\",
              \"title\": \"Depsweep: $CHARTER → $REPO ($TICKET)\",
              \"labels\": [\"jules-helper\", \"slot:migration-scribe\", \"wave-3.5\", \"agent:kq-jules-depsweep\"]
            }" \
            "https://jules.googleapis.com/v1alpha/sessions")

          SESSION_ID=$(echo "$RESPONSE" | jq -r '.name')
          SESSION_NUM=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "::error::Failed to create sweep session for $REPO ($CHARTER)"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          fi

          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"

          echo "### Depsweep Session: $CHARTER → $REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Session** | \`$SESSION_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repo** | $REPO |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Charter** | $CHARTER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ticket** | $TICKET |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | $BRANCH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://jules.google.com/task/$SESSION_NUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | Auto-approved — executing |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
