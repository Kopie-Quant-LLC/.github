name: Jules — Create Session

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo (e.g., kq-knowledge-graph)'
        required: true
        type: choice
        options:
          - kq-knowledge-graph
          # Phase 3 expands this list
      prompt:
        description: 'Task prompt for Jules'
        required: true
        type: string
      branch:
        description: 'Starting branch (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  create-session:
    name: Create Jules session
    runs-on: ubuntu-latest
    if: github.actor == 'YXZYSME'
    steps:
      - name: Validate actor gate
        run: |
          echo "✅ Actor gate passed: ${{ github.actor }}"

      - name: Resolve source ID
        id: source
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
        run: |
          SOURCES=$(curl -sf \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sources")
          echo "Raw sources response received"

          SOURCE_NAME=$(echo "$SOURCES" | jq -r \
            '.sources[] | select(.githubRepo.owner == "Kopie-Quant-LLC" and .githubRepo.repo == "${{ inputs.target_repo }}") | .name')

          # Fallback: try matching by id field pattern
          if [ -z "$SOURCE_NAME" ] || [ "$SOURCE_NAME" = "null" ]; then
            SOURCE_NAME=$(echo "$SOURCES" | jq -r \
              '.sources[] | select(.name | contains("Kopie-Quant-LLC/${{ inputs.target_repo }}")) | .name')
          fi

          # Fallback: try matching by id field
          if [ -z "$SOURCE_NAME" ] || [ "$SOURCE_NAME" = "null" ]; then
            SOURCE_NAME=$(echo "$SOURCES" | jq -r \
              '.sources[] | select(.id | contains("Kopie-Quant-LLC/${{ inputs.target_repo }}")) | .name')
          fi

          if [ -z "$SOURCE_NAME" ] || [ "$SOURCE_NAME" = "null" ]; then
            echo "::error::Source not found for ${{ inputs.target_repo }}. Available sources:"
            echo "$SOURCES" | jq '.sources[].name' 2>/dev/null || echo "$SOURCES"
            exit 1
          fi

          echo "source_name=$SOURCE_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved source: $SOURCE_NAME"

      - name: Create session
        id: session
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
        run: |
          PROMPT_JSON=$(echo '${{ inputs.prompt }}' | jq -Rs .)
          RESPONSE=$(curl -sf -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"prompt\": $PROMPT_JSON,
              \"sourceContext\": {
                \"source\": \"${{ steps.source.outputs.source_name }}\",
                \"githubRepoContext\": {
                  \"startingBranch\": \"${{ inputs.branch }}\"
                }
              },
              \"requirePlanApproval\": true,
              \"automationMode\": \"AUTO_CREATE_PR\",
              \"title\": \"Orchestrated: ${{ inputs.target_repo }}\"
            }" \
            "https://jules.googleapis.com/v1alpha/sessions")

          SESSION_ID=$(echo "$RESPONSE" | jq -r '.name')
          SESSION_NUM=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "::error::Failed to create session"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"

          echo "### Jules Session Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Session** | \`$SESSION_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target** | ${{ inputs.target_repo }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | ${{ inputs.branch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://jules.google.com/task/$SESSION_NUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | Awaiting plan approval |" >> "$GITHUB_STEP_SUMMARY"

      # Slack notification — uncomment when KQ_SLACK_WEBHOOK is provisioned
      # - name: Notify Slack
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.KQ_SLACK_WEBHOOK }}
      #   run: |
      #     SESSION_NUM=$(echo '${{ steps.session.outputs.session_id }}' | grep -oE '[0-9]+$')
      #     curl -s -X POST "$SLACK_WEBHOOK" \
      #       -H "Content-Type: application/json" \
      #       -d "{\"text\": \"Jules session awaiting approval\nRepo: ${{ inputs.target_repo }}\nSession: ${{ steps.session.outputs.session_id }}\nhttps://jules.google.com/task/$SESSION_NUM\"}"
