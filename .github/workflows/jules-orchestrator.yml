name: Jules — Create Session

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repo (e.g., kq-knowledge-graph)'
        required: true
        type: choice
        options:
          - kq-knowledge-graph
          # Phase 3 expands this list
      prompt:
        description: 'Task prompt for Jules'
        required: true
        type: string
      branch:
        description: 'Starting branch (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  create-session:
    name: Create Jules session
    runs-on: ubuntu-latest
    if: github.actor == 'YXZYSME'
    steps:
      - name: Validate actor gate
        run: |
          echo "✅ Actor gate passed: ${{ github.actor }}"

      - name: Resolve source ID
        id: source
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
        run: |
          SOURCES=$(curl -s -H "Authorization: Bearer $JULES_API_KEY" \
            "https://jules.api.google.com/v1alpha/sources")
          SOURCE_ID=$(echo "$SOURCES" | jq -r \
            ".sources[] | select(.githubRepository.fullName == \"Kopie-Quant-LLC/${{ inputs.target_repo }}\") | .name")
          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::error::Source not found for ${{ inputs.target_repo }}"
            exit 1
          fi
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved source: $SOURCE_ID"

      - name: Create session
        id: session
        env:
          JULES_API_KEY: ${{ secrets.KQ_JULES_API_KEY }}
        run: |
          PROMPT_JSON=$(echo '${{ inputs.prompt }}' | jq -Rs .)
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"source\": \"${{ steps.source.outputs.source_id }}\",
              \"prompt\": $PROMPT_JSON,
              \"title\": \"Orchestrated: ${{ inputs.target_repo }}\",
              \"startBranch\": \"${{ inputs.branch }}\",
              \"requirePlanApproval\": true,
              \"automationMode\": \"AUTOMATION_MODE_UNSPECIFIED\"
            }" \
            "https://jules.api.google.com/v1alpha/sessions")

          SESSION_ID=$(echo "$RESPONSE" | jq -r '.name')
          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "::error::Failed to create session"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          TASK_NUM="${SESSION_ID##*/}"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"

          echo "### Jules Session Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Session** | \`$SESSION_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target** | ${{ inputs.target_repo }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | ${{ inputs.branch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://jules.google.com/task/$TASK_NUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | Awaiting plan approval |" >> "$GITHUB_STEP_SUMMARY"

      # Slack notification — uncomment when KQ_SLACK_WEBHOOK is provisioned
      # - name: Notify Slack
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.KQ_SLACK_WEBHOOK }}
      #   run: |
      #     TASK_NUM="${{ steps.session.outputs.session_id }}"
      #     TASK_NUM="${TASK_NUM##*/}"
      #     curl -s -X POST "$SLACK_WEBHOOK" \
      #       -H "Content-Type: application/json" \
      #       -d "{\"text\": \"Jules session awaiting approval\nRepo: ${{ inputs.target_repo }}\nSession: ${{ steps.session.outputs.session_id }}\nhttps://jules.google.com/task/$TASK_NUM\"}"
